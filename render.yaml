services:
  - type: web
    name: hireready-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      # MONGO_URI is omitted to fallback to Memory-DB, or the user can supply it in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
